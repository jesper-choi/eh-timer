<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>eh timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
	--bg: #0b0d11;
	--surface: #14181f;
	--surface-2: #1b2029;
	--border: #262c38;
	--text: #e9ecf1;
	--muted: #8b93a3;
	--accent: #7aa2f7;
	--ready: #4ade80;
	--hold: #f87171;
	--warn: #fbbf24;
	--radius: 14px;
	/* 숫자 폭이 고정돼야 카운트가 흔들리지 않는다 */
	--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	-webkit-touch-callout: none !important;
	-webkit-user-select: none !important;
	user-select: none !important;
}
html, body { height: 100%; }
html, body, #app, #stage {
	touch-action: none !important;
}
body {
	background: var(--bg);
	color: var(--text);
	font: 15px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
	overflow: hidden;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;      /* 태블릿에서 당겨서 새로고침 방지 */
}
button, select { font: inherit; color: inherit; }
#times, select, button, dialog { touch-action: pan-y !important; }
input, textarea { -webkit-user-select: text !important; user-select: text !important; touch-action: auto !important; }

#app {
	display: grid;
	grid-template-columns: 300px 1fr;
	height: 100%;
}

/* ── sidebar ── */
aside {
	background: var(--surface);
	border-right: 1px solid var(--border);
	display: flex;
	flex-direction: column;
	min-height: 0;
}
.brand {
	padding: 16px 20px 10px;
	font-size: 13px;
	letter-spacing: .18em;
	text-transform: uppercase;
	color: var(--muted);
}
.brand b { color: var(--text); font-weight: 600; }

.session-ctrl {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 0 14px 12px;
}
.session-select-wrap {
	position: relative;
	flex: 1;
	min-width: 0;
	display: flex;
	align-items: center;
}
.session-select-wrap select#session {
	width: 100%;
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	padding: 7px 26px 7px 11px;
	font-size: 13px;
	font-weight: 500;
	color: var(--text);
	cursor: pointer;
	text-overflow: ellipsis;
	-webkit-appearance: none;
	appearance: none;
	transition: all 0.15s ease;
}
.session-select-wrap select#session:hover {
	border-color: rgba(255, 255, 255, 0.18);
	background: #1f2530;
}
.session-select-wrap select#session:focus {
	outline: none;
	border-color: var(--accent);
	box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.15);
}
.session-select-wrap .select-arrow {
	position: absolute;
	right: 9px;
	pointer-events: none;
	color: var(--muted);
}
.session-btn-group {
	display: flex;
	align-items: center;
	gap: 4px;
}
.btn-s-action {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 8px;
	width: 30px;
	height: 30px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	color: var(--muted);
	cursor: pointer;
	flex-shrink: 0;
	transition: all 0.15s ease;
}
.btn-s-action:hover {
	color: var(--text);
	border-color: rgba(255, 255, 255, 0.2);
	background: #222936;
	transform: translateY(-1px);
}
.btn-s-action:active {
	transform: translateY(0) scale(0.96);
}
.btn-s-action#addSession:hover {
	color: var(--accent);
	border-color: rgba(122, 162, 247, 0.4);
}
.btn-s-action#renSession:hover {
	color: var(--text);
}
.btn-s-action.btn-s-del:hover {
	color: var(--hold);
	border-color: rgba(248, 113, 113, 0.4);
	background: rgba(248, 113, 113, 0.08);
}

.stats {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 1px;
	background: var(--border);
	border-block: 1px solid var(--border);
}
.stat { background: var(--surface); padding: 12px 14px; }
.stat span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.stat b { font-size: 18px; font-weight: 600; font-family: var(--mono); }

.list-head {
	display: flex; align-items: center; justify-content: space-between;
	padding: 12px 16px 8px; font-size: 12px; color: var(--muted);
}
#times { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.solve {
	display: flex; align-items: center; gap: 6px;
	padding: 7px 8px; border-radius: 10px;
	font-family: var(--mono);
}
.solve:hover { background: var(--surface-2); }
.solve .idx { width: 34px; color: var(--muted); font-size: 12px; }
.solve .t { flex: 1; font-weight: 500; }
.solve.dnf .t { color: var(--muted); text-decoration: line-through; }
.solve .acts { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.solve:hover .acts, .solve:focus-within .acts { opacity: 1; }
.solve .acts button {
	background: transparent; border: 1px solid var(--border); border-radius: 8px;
	padding: 2px 7px; font-size: 11px; color: var(--muted); cursor: pointer;
}
.solve .acts button:hover { color: var(--text); border-color: var(--muted); }
.solve .acts button.on { background: var(--accent); border-color: var(--accent); color: #0b0d11; }

.side-foot { padding: 10px 16px 16px; display: flex; gap: 8px; }
.side-foot button {
	flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
	padding: 8px; font-size: 12px; color: var(--muted); cursor: pointer;
	white-space: nowrap;
}
.side-foot button:hover { color: var(--text); }

/* ── main ── */
main {
	display: flex; flex-direction: column;
	min-width: 0;
	position: relative;
}
header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	padding: 14px 24px;
	border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}
.hdr-group {
	display: flex;
	align-items: center;
	gap: 8px;
}
.select-wrap {
	position: relative;
	display: inline-flex;
	align-items: center;
}
.event-select-wrap select#event {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 10px;
	padding: 7px 28px 7px 32px;
	font-size: 13px;
	font-weight: 600;
	color: var(--text);
	cursor: pointer;
	-webkit-appearance: none;
	appearance: none;
	transition: all 0.15s ease;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.event-select-wrap select#event:hover {
	border-color: rgba(255, 255, 255, 0.2);
	background: #1f2530;
}
.event-select-wrap select#event:focus {
	outline: none;
	border-color: var(--accent);
	box-shadow: 0 0 0 2px rgba(122, 162, 247, 0.2);
}
.event-select-wrap .event-icon {
	position: absolute;
	left: 11px;
	pointer-events: none;
	color: var(--accent);
	opacity: 0.9;
}
.event-select-wrap .select-arrow {
	position: absolute;
	right: 10px;
	pointer-events: none;
	color: var(--muted);
}
.hdr-btn {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 10px;
	padding: 7px 12px;
	font-size: 13px;
	font-weight: 500;
	color: var(--muted);
	cursor: pointer;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	transition: color 0.15s, background 0.15s, border-color 0.15s, transform 0.08s;
	white-space: nowrap;
}
.hdr-btn:hover {
	color: var(--text);
	border-color: rgba(255, 255, 255, 0.15);
	background: #202733;
}
.hdr-btn:active {
	transform: scale(0.98);
}
.hdr-btn .btn-icon {
	font-size: 13px;
	line-height: 1;
	opacity: 0.85;
}
.hdr-btn.toggle.on {
	background: rgba(122, 162, 247, 0.15);
	border-color: var(--accent);
	color: var(--accent);
	font-weight: 600;
}
#insp .btn-dot {
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--muted);
	display: inline-block;
	transition: background 0.15s, box-shadow 0.15s;
}
#insp.on .btn-dot {
	background: var(--ready);
	box-shadow: 0 0 6px var(--ready);
}
.btn-cancel {
	color: var(--muted);
}
.btn-cancel:hover {
	color: var(--warn);
	border-color: rgba(251, 191, 36, 0.35);
	background: rgba(251, 191, 36, 0.08);
}
.btn-sync.on {
	background: rgba(74, 222, 128, 0.12);
	border-color: rgba(74, 222, 128, 0.4);
	color: var(--ready);
}
header .spacer { flex: 1; }
header .hint {
	color: var(--muted);
	font-size: 12px;
	max-width: 240px;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

#scramble {
	padding: 8px 40px 0;
	text-align: center;
	font-size: clamp(16px, 2.2vw, 26px);
	line-height: 1.45;
	font-weight: 500;
	letter-spacing: .01em;
	max-width: 980px;
	margin-inline: auto;
	word-spacing: .35em;
	cursor: pointer;
	min-height: 2.9em;
}
#stage {
	flex: 1;
	display: grid;
	place-items: center;
	min-height: 0;
	container-type: inline-size;
	touch-action: none;        /* 롱프레스·스크롤·확대 제스처를 브라우저가 가로채지 않게 */
}
#time {
	/* 글자 수(--ch)에 맞춰 가로폭을 꽉 채우는 크기. 고정폭 폰트 한 자 ≈ 0.62em */
	font-size: min(calc(94cqw / (var(--ch, 6) * 0.62)), 40vh, 400px);
	font-family: var(--mono);
	font-weight: 300;
	letter-spacing: -.02em;
	line-height: 1;
	transition: color .08s;
}
body.inspect #time { color: var(--warn); }
body.hold #time { color: var(--hold); }
body.ready #time { color: var(--ready); }
body.running #scramble, body.running header, body.running aside { opacity: .12; transition: opacity .2s; }
footer { padding: 12px 24px 18px; text-align: center; color: var(--muted); font-size: 12px; }

/* ── 동기화 설정 ── */
dialog {
	background: var(--surface); color: var(--text);
	border: 1px solid var(--border); border-radius: var(--radius);
	padding: 22px; max-width: 420px; width: calc(100% - 32px);
}
dialog::backdrop { background: #000a; }
dialog h3 { font-size: 16px; margin-bottom: 8px; }
dialog p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
dialog input {
	display: block; width: 100%; margin-top: 5px; padding: 9px 11px;
	background: var(--bg); color: var(--text);
	border: 1px solid var(--border); border-radius: 9px; font-size: 14px;
}
dialog .row { display: flex; gap: 8px; margin-top: 16px; }
dialog .row button {
	flex: 1; padding: 9px; border-radius: 9px; cursor: pointer;
	background: var(--surface-2); border: 1px solid var(--border); font-size: 13px;
}
dialog .row button:first-child { background: var(--accent); border-color: var(--accent); color: #0b0d11; }
#gmsg { font-size: 12px; color: var(--muted); min-height: 1.4em; }
#gmsg.err { color: var(--hold); }
#gmsg.ok { color: var(--ready); }

/* ── 터치 기기(태블릿/폰) 전용 배율. 마우스 쓰는 PC에는 적용되지 않는다 ── */
@media (pointer: coarse) {
	/* 타이머 크기 조절: 가운데 20vh 값만 바꾸면 된다 (크게 26vh / 작게 16vh) */
	#time { font-size: min(calc(68cqw / (var(--ch, 6) * 0.62)), 20vh, 180px); }
	#scramble { font-size: clamp(15px, 1.8vw, 20px); min-height: 2.6em; padding: 4px 24px 0; }
	header {
		padding: 10px 14px;
		gap: 6px;
		flex-wrap: wrap;
	}
	.hdr-group {
		gap: 6px;
	}
	select#event, .hdr-btn {
		padding: 6px 10px;
		font-size: 12px;
		border-radius: 8px;
	}
	select#event {
		padding-right: 24px;
	}
	.brand { padding: 12px 16px 10px; }
	.stat { padding: 10px 12px; }
	.stat b { font-size: 16px; }
	.solve { padding: 6px 8px; }
	.side-foot { padding: 10px 10px 14px; gap: 6px; }
	.side-foot button { padding: 8px 4px; font-size: 11px; letter-spacing: -0.03em; }
	footer { display: none; }      /* 키보드 안내는 터치에서 필요 없다 */
}
@media (pointer: coarse) and (min-width: 821px) {
	#app { grid-template-columns: 250px 1fr; }
}

@media (max-width: 820px) {
	#app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
	aside { order: 2; border-right: 0; border-top: 1px solid var(--border); max-height: 42vh; }
	.brand { display: none; }
	footer { display: none; }
}
</style>
</head>
<body>
<div id="app">
	<aside>
		<div class="brand"><b>eh</b> timer</div>
		<div class="session-ctrl">
			<div class="session-select-wrap">
				<select id="session" title="세션 선택"></select>
				<svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
			</div>
			<div class="session-btn-group">
				<button id="addSession" class="btn-s-action" title="새 세션 추가">
					<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
				</button>
				<button id="renSession" class="btn-s-action" title="세션 이름 변경">
					<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
				</button>
				<button id="delSession" class="btn-s-action btn-s-del" title="세션 삭제">
					<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
				</button>
			</div>
		</div>
		<div class="stats" id="stats"></div>
		<div class="list-head"><span id="count">0 solves</span></div>
		<div id="times"></div>
		<div class="side-foot">
			<button id="export">내보내기</button>
			<button id="import">가져오기</button>
			<button id="clear">기록 비우기</button>
		</div>
	</aside>
	<main>
		<header>
			<div class="hdr-group hdr-left">
				<div class="select-wrap event-select-wrap">
					<svg class="event-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
					<select id="event" title="종목 선택"></select>
					<svg class="select-arrow" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</div>
				<button id="insp" class="hdr-btn toggle" title="인스펙션 15초 카운트다운 토글"><span class="btn-dot"></span>인스펙션 15s</button>
				<button id="newscr" class="hdr-btn" title="새 스크램블 생성"><span class="btn-icon">↻</span>새 스크램블</button>
				<button id="cancel" class="hdr-btn btn-cancel" title="타이머 0초로 되돌리기 (Esc)"><span class="btn-icon">↺</span>타이머 리셋</button>
			</div>
			<span class="spacer"></span>
			<div class="hdr-group hdr-right">
				<span class="hint" id="status"></span>
				<button id="sync" class="hdr-btn toggle btn-sync" title="Gist 동기화 설정"><span class="btn-icon">☁</span>동기화</button>
			</div>
		</header>
		<div id="scramble">스크램블 생성 중…</div>
		<div id="stage"><div id="time" style="--ch: 6">0.000</div></div>
		<footer>스페이스를 누르고 있다가 떼면 시작(인스펙션 켜면 카운트다운 먼저) · 아무 키나 누르면 정지 · Esc 타이머 리셋 · 스크램블 클릭하면 새로 생성</footer>
	</main>
</div>
<input type="file" id="file" accept="application/json" hidden>

<dialog id="syncdlg">
	<h3>gist 동기화</h3>
	<p>기록을 비공개 gist와 자동으로 합칩니다. 토큰은 <b>이 기기 브라우저에만</b> 저장되고 서버로 전송되지 않습니다.</p>
	<label>gist ID <input id="gid" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="a1b2c3d4..."></label>
	<label>토큰 (gist 스코프) <input id="gtok" type="password" autocomplete="off" placeholder="ghp_..."></label>
	<div id="gmsg"></div>
	<div class="row">
		<button id="gsave">저장하고 동기화</button>
		<button id="gdel">토큰 삭제</button>
		<button id="gclose">닫기</button>
	</div>
</dialog>

<dialog id="rendlg">
	<h3>세션 이름 변경</h3>
	<p>세션의 새로운 이름을 입력하세요.</p>
	<label>세션 이름 <input id="renInput" autocomplete="off" spellcheck="false" maxlength="50" placeholder="예: session 1, 3x3 OH"></label>
	<div class="row">
		<button id="renSave">저장</button>
		<button id="renCancel">취소</button>
	</div>
</dialog>

<script>
// 서비스 워커 강제 갱신: index.html은 네트워크 우선이므로 이 인라인 스크립트는 항상 최신이다.
// 구버전 SW가 구 app.js/stats.js를 캐시하고 있으면 여기서 강제로 갱신한다.
if (navigator.serviceWorker) {
	navigator.serviceWorker.register('sw.js').then(function(reg) {
		reg.update().catch(function(){});
		// 새 SW가 대기 중이면 즉시 활성화
		if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
		reg.addEventListener('updatefound', function() {
			var nw = reg.installing;
			if (nw) nw.addEventListener('statechange', function() {
				if (nw.state === 'installed' && navigator.serviceWorker.controller) {
					nw.postMessage({ type: 'SKIP_WAITING' });
				}
			});
		});
	}).catch(function(){});
	navigator.serviceWorker.addEventListener('controllerchange', function() {
		window.location.reload();
	});
}
</script>
<script src="stats.js?v=14"></script>
<script src="app.js?v=14"></script>
</body>
</html>
