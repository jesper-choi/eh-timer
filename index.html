<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>eh timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
	--bg: #090d16;
	--surface: #0f172a;
	--surface-2: #162035;
	--border: #1e2d4a;
	--text: #f1f5f9;
	--muted: #94a3b8;
	--accent: #38bdf8;
	--accent-blue: #60a5fa;
	--ready: #4ade80;
	--hold: #f87171;
	--warn: #fbbf24;
	--radius: 14px;
	/* 숫자 폭이 고정돼야 카운트가 흔들리지 않는다 */
	--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
	-webkit-touch-callout: none !important;
	-webkit-user-select: none !important;
	user-select: none !important;
}
html, body { height: 100%; }
html, body, #app, #stage {
	touch-action: none !important;
}
body {
	background: var(--bg);
	color: var(--text);
	font: 15px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
	overflow: hidden;
	-webkit-tap-highlight-color: transparent;
	overscroll-behavior: none;      /* 태블릿에서 당겨서 새로고침 방지 */
}
button, select { font: inherit; color: inherit; }
#times, select, button, dialog { touch-action: pan-y !important; }
input, textarea { -webkit-user-select: text !important; user-select: text !important; touch-action: auto !important; }

#app {
	display: grid;
	grid-template-columns: 300px 1fr;
	height: 100%;
}

/* ── sidebar ── */
aside {
	background: var(--surface);
	border-right: 1px solid var(--border);
	display: flex;
	flex-direction: column;
	min-height: 0;
}
.brand {
	padding: 16px 18px 14px;
	display: flex;
	align-items: center;
	gap: 11px;
	user-select: none;
}
.brand-title {
	display: flex;
	align-items: center;
	gap: 6px;
}
.brand-eh {
	color: #38bdf8;
	font-weight: 800;
	font-size: 15px;
	letter-spacing: 0.05em;
	line-height: 1;
}
.brand-timer {
	color: var(--text);
	font-weight: 600;
	font-size: 13px;
	letter-spacing: 0.16em;
	line-height: 1;
	opacity: 0.88;
}

/* ── 3D Animated Rubik's Cube ── */
.cube-anim-box {
	width: 26px;
	height: 26px;
	perspective: 160px;
	display: flex;
	align-items: center;
	justify-content: center;
	flex-shrink: 0;
}
.cube-3d {
	width: 18px;
	height: 18px;
	position: relative;
	transform-style: preserve-3d;
	-webkit-transform-style: preserve-3d;
	animation: cube-spin 8s linear infinite;
}
@keyframes cube-spin {
	0%   { transform: rotateX(-26deg) rotateY(45deg) rotateZ(0deg); }
	25%  { transform: rotateX(-18deg) rotateY(135deg) rotateZ(5deg); }
	50%  { transform: rotateX(22deg) rotateY(225deg) rotateZ(-4deg); }
	75%  { transform: rotateX(-24deg) rotateY(315deg) rotateZ(4deg); }
	100% { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg); }
}
.cube-face {
	position: absolute;
	width: 18px;
	height: 18px;
	background: #000;
	border: 1px solid #000;
	border-radius: 2px;
	display: grid;
	grid-template-columns: repeat(3, 1fr);
	gap: 1px;
	padding: 1px;
	box-sizing: border-box;
	backface-visibility: visible;
	-webkit-backface-visibility: visible;
}
.cube-front  { transform: rotateY(0deg) translateZ(9px); filter: brightness(1.0); }
.cube-back   { transform: rotateY(180deg) translateZ(9px); filter: brightness(0.8); }
.cube-right  { transform: rotateY(90deg) translateZ(9px); filter: brightness(0.9); }
.cube-left   { transform: rotateY(-90deg) translateZ(9px); filter: brightness(0.85); }
.cube-top    { transform: rotateX(90deg) translateZ(9px); filter: brightness(1.15); }
.cube-bottom { transform: rotateX(-90deg) translateZ(9px); filter: brightness(0.72); }

.c-sticker {
	border-radius: 1px;
	display: block;
}
.cs-b { background: #38bdf8; } /* Electric Blue */
.cs-g { background: #4ade80; } /* Emerald Green */
.cs-r { background: #f87171; } /* Coral Red */
.cs-o { background: #fb923c; } /* Cyber Orange */
.cs-w { background: #f8fafc; } /* Ice White */
.cs-y { background: #facc15; } /* Sun Yellow */

.session-ctrl {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 0 14px 12px;
}
.session-select-wrap {
	position: relative;
	flex: 1;
	min-width: 0;
	display: flex;
	align-items: center;
}
.session-select-wrap select#session {
	width: 100%;
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	padding: 7px 26px 7px 11px;
	font-size: 13px;
	font-weight: 500;
	color: var(--text);
	cursor: pointer;
	text-overflow: ellipsis;
	-webkit-appearance: none;
	appearance: none;
	transition: all 0.15s ease;
}
.session-select-wrap select#session:hover {
	border-color: rgba(56, 189, 248, 0.3);
	background: #1a2742;
}
.session-select-wrap select#session:focus {
	outline: none;
	border-color: var(--accent);
	box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
}
.session-select-wrap .select-arrow {
	position: absolute;
	right: 9px;
	pointer-events: none;
	color: var(--muted);
}
.session-btn-group {
	display: flex;
	align-items: center;
	gap: 5px;
}
.btn-s-action {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	width: 32px;
	height: 32px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	color: var(--muted);
	cursor: pointer;
	flex-shrink: 0;
	transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-s-action:hover {
	color: var(--text);
	border-color: rgba(56, 189, 248, 0.35);
	background: #1e293b;
	transform: translateY(-1px);
}
.btn-s-action:active {
	transform: translateY(0) scale(0.96);
}
.btn-s-action#addSession:hover {
	color: var(--accent);
	border-color: rgba(56, 189, 248, 0.5);
}
.btn-s-action#renSession:hover {
	color: var(--text);
}
.btn-s-action.btn-s-del:hover {
	color: var(--hold);
	border-color: rgba(248, 113, 113, 0.4);
	background: rgba(248, 113, 113, 0.08);
}

.stats {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 1px;
	background: var(--border);
	border-block: 1px solid var(--border);
}
.stat {
	background: var(--surface);
	padding: 12px 14px;
	transition: background 0.15s;
}
.stat:hover {
	background: var(--surface-2);
}
.stat span {
	display: block;
	font-size: 11px;
	color: var(--muted);
	letter-spacing: .08em;
	text-transform: uppercase;
}
.stat b {
	font-size: 18px;
	font-weight: 600;
	font-family: var(--mono);
	color: var(--text);
}
.stat:first-child b {
	color: var(--accent); /* Best time in electric sky blue */
}

.list-head {
	display: flex; align-items: center; justify-content: space-between;
	padding: 12px 16px 8px; font-size: 12px; color: var(--muted);
}
#times { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.solve {
	display: flex; align-items: center; gap: 6px;
	padding: 7px 10px; border-radius: 9px;
	font-family: var(--mono);
	transition: background 0.12s;
}
.solve:hover { background: var(--surface-2); }
.solve .idx { width: 34px; color: #64748b; font-size: 12px; }
.solve .t { flex: 1; font-weight: 500; }
.solve.dnf .t { color: #64748b; text-decoration: line-through; }
.solve .acts { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.solve:hover .acts, .solve:focus-within .acts { opacity: 1; }
.solve .acts button {
	background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px;
	padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
	transition: all 0.12s ease;
}
.solve .acts button:hover { color: var(--text); border-color: rgba(56, 189, 248, 0.4); }
.solve .acts button.on { background: var(--accent); border-color: var(--accent); color: #090d16; font-weight: 700; }

.side-foot {
	padding: 12px 14px 16px;
	display: flex;
}
.btn-clear-solves {
	width: 100%;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	gap: 7px;
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	padding: 9px 14px;
	font-size: 12px;
	font-weight: 500;
	color: var(--muted);
	cursor: pointer;
	transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
.btn-clear-solves:hover {
	color: var(--hold);
	border-color: rgba(248, 113, 113, 0.4);
	background: rgba(248, 113, 113, 0.08);
	transform: translateY(-1px);
}
.btn-clear-solves:active {
	transform: translateY(0) scale(0.98);
}

/* ── main ── */
main {
	display: flex; flex-direction: column;
	min-width: 0;
	position: relative;
}
header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	padding: 14px 24px;
	border-bottom: 1px solid rgba(255, 255, 255, 0.04);
}
.hdr-group {
	display: flex;
	align-items: center;
	gap: 8px;
}
.select-wrap {
	position: relative;
	display: inline-flex;
	align-items: center;
}
.event-select-wrap select#event {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	padding: 7px 28px 7px 32px;
	font-size: 13px;
	font-weight: 600;
	color: var(--text);
	cursor: pointer;
	-webkit-appearance: none;
	appearance: none;
	transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
.event-select-wrap select#event:hover {
	border-color: rgba(56, 189, 248, 0.3);
	background: #1e293b;
}
.event-select-wrap select#event:focus {
	outline: none;
	border-color: var(--accent);
	box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
}
.event-select-wrap .event-icon {
	position: absolute;
	left: 11px;
	pointer-events: none;
	color: var(--accent);
	opacity: 0.9;
}
.event-select-wrap .select-arrow {
	position: absolute;
	right: 10px;
	pointer-events: none;
	color: var(--muted);
}
.hdr-btn {
	background: var(--surface-2);
	border: 1px solid var(--border);
	border-radius: 9px;
	padding: 7px 13px;
	font-size: 13px;
	font-weight: 500;
	color: var(--muted);
	cursor: pointer;
	display: inline-flex;
	align-items: center;
	gap: 6px;
	transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
	white-space: nowrap;
}
.hdr-btn:hover {
	color: var(--text);
	border-color: rgba(56, 189, 248, 0.3);
	background: #1e293b;
	transform: translateY(-1px);
}
.hdr-btn:active {
	transform: translateY(0) scale(0.97);
}
.hdr-btn .btn-icon {
	font-size: 13px;
	line-height: 1;
	opacity: 0.85;
}
.hdr-btn.toggle.on {
	background: rgba(56, 189, 248, 0.12);
	border-color: var(--accent);
	color: var(--accent);
	font-weight: 600;
}
#insp .btn-dot {
	width: 6px;
	height: 6px;
	border-radius: 50%;
	background: var(--muted);
	display: inline-block;
	transition: background 0.15s, box-shadow 0.15s;
}
#insp.on .btn-dot {
	background: var(--ready);
	box-shadow: 0 0 6px var(--ready);
}
.btn-cancel {
	color: #facc15;
	border-color: rgba(250, 204, 21, 0.3);
	background: rgba(250, 204, 21, 0.08);
	font-weight: 600;
}
.btn-cancel:hover {
	color: #fef08a;
	border-color: rgba(250, 204, 21, 0.6);
	background: rgba(250, 204, 21, 0.16);
	box-shadow: 0 0 10px rgba(250, 204, 21, 0.2);
}
.btn-cancel:active {
	background: rgba(250, 204, 21, 0.25);
	transform: translateY(0) scale(0.97);
}
.btn-sync.on {
	background: rgba(74, 222, 128, 0.12);
	border-color: rgba(74, 222, 128, 0.4);
	color: var(--ready);
}
header .spacer { flex: 1; }
header .hint {
	color: var(--muted);
	font-size: 12px;
	max-width: 240px;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}

#scramble {
	padding: 8px 40px 0;
	text-align: center;
	font-size: clamp(16px, 2.2vw, 26px);
	line-height: 1.45;
	font-weight: 500;
	letter-spacing: .01em;
	max-width: 980px;
	margin-inline: auto;
	word-spacing: .35em;
	cursor: pointer;
	min-height: 2.9em;
}
#stage {
	flex: 1;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	min-height: 0;
	container-type: inline-size;
	touch-action: none;        /* 롱프레스·스크롤·확대 제스처를 브라우저가 가로채지 않게 */
	position: relative;
	gap: 60px;
	padding: 16px 16px 24px;
}
.stage-cube-wrap {
	display: flex;
	align-items: center;
	justify-content: center;
	transition: opacity 0.25s ease, transform 0.25s ease;
	margin-top: 0;
	margin-bottom: 32px;
	position: relative;
	animation: stage-cube-glow-pulse 6.0s ease-in-out infinite;
}
@keyframes stage-cube-glow-pulse {
	0%, 48% {
		filter: drop-shadow(0 10px 20px rgba(56, 189, 248, 0.2));
	}
	52%, 88% {
		/* 🎉 SOLVED VICTORY BURST! Glorious emerald & electric cyan ambient shockwave (2+ sec hold) */
		filter: drop-shadow(0 0 36px rgba(56, 189, 248, 0.95))
		        drop-shadow(0 0 18px rgba(74, 222, 128, 0.8))
		        drop-shadow(0 12px 28px rgba(0, 0, 0, 0.6));
	}
	94%, 100% {
		filter: drop-shadow(0 10px 20px rgba(56, 189, 248, 0.2));
	}
}
.stage-cube-wrap::after {
	content: '';
	position: absolute;
	inset: -14px;
	border-radius: 50%;
	border: 2px solid rgba(56, 189, 248, 0);
	pointer-events: none;
	opacity: 0;
	animation: solve-halo-burst 6.0s ease-out infinite;
}
@keyframes solve-halo-burst {
	0%, 51% {
		transform: scale(0.6);
		opacity: 0;
		border-color: rgba(56, 189, 248, 0);
	}
	52% {
		transform: scale(0.85);
		opacity: 1;
		border-color: rgba(56, 189, 248, 0.9);
		box-shadow: 0 0 24px rgba(56, 189, 248, 0.7), inset 0 0 20px rgba(74, 222, 128, 0.4);
	}
	68% {
		transform: scale(1.6);
		opacity: 0;
		border-color: rgba(74, 222, 128, 0);
	}
	100% {
		transform: scale(1.7);
		opacity: 0;
	}
}
.stage-cube-wrap .cube-anim-box {
	width: 120px;
	height: 120px;
	perspective: 550px;
}
.stage-cube-wrap .cube-3d {
	width: 80px;
	height: 80px;
	position: relative;
	transform-style: preserve-3d;
	-webkit-transform-style: preserve-3d;
	animation: stage-cube-solve-spin 6.0s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
}
@keyframes stage-cube-solve-spin {
	/* ── PHASE 1: Cross & First Layer solving (0.0s - 1.5s) ── */
	0%   { transform: rotateX(-26deg) rotateY(45deg) rotateZ(0deg) scale(0.96); }
	15%  { transform: rotateX(-20deg) rotateY(150deg) rotateZ(6deg) scale(1); }
	30%  { transform: rotateX(22deg) rotateY(255deg) rotateZ(-4deg) scale(1.02); }
	
	/* ── PHASE 2: F2L & OLL/PLL solving (1.5s - 3.1s) ── */
	42%  { transform: rotateX(-22deg) rotateY(360deg) rotateZ(4deg) scale(1.03); }
	50%  { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.12); }

	/* ── PHASE 3: 🎉 SOLVED! Smooth Long Hold (3.1s - 5.4s) ── */
	55%  { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.06); }
	88%  { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.06); }

	/* ── PHASE 4: Smooth glide back to scramble (5.4s - 6.0s) ── */
	95%  { transform: rotateX(-18deg) rotateY(420deg) rotateZ(6deg) scale(0.94); }
	100% { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(0.96); }
}

/* ── NxN 3D Cube Face Geometry ── */
.stage-cube-wrap .cube-face {
	position: absolute;
	width: 80px;
	height: 80px;
	background: #000;
	border: 2px solid #000;
	border-radius: 6px;
	display: grid;
	box-sizing: border-box;
	backface-visibility: visible;
	-webkit-backface-visibility: visible;
}
.stage-cube-wrap .cube-front  { transform: rotateY(0deg) translateZ(40px); filter: brightness(1.0); }
.stage-cube-wrap .cube-back   { transform: rotateY(180deg) translateZ(40px); filter: brightness(0.78); }
.stage-cube-wrap .cube-right  { transform: rotateY(90deg) translateZ(40px); filter: brightness(0.88); }
.stage-cube-wrap .cube-left   { transform: rotateY(-90deg) translateZ(40px); filter: brightness(0.82); }
.stage-cube-wrap .cube-top    { transform: rotateX(90deg) translateZ(40px); filter: brightness(1.15); }
.stage-cube-wrap .cube-bottom { transform: rotateX(-90deg) translateZ(40px); filter: brightness(0.70); }

/* Grid definitions for 2x2 ~ 7x7 */
.grid-2 { grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 4px; }
.grid-2 .c-sticker { border-radius: 4px; box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.4); }

.grid-3 { grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
.grid-3 .c-sticker { border-radius: 3px; box-shadow: inset 0 0 3px rgba(255, 255, 255, 0.4); }

.grid-4 { grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2.5px; }
.grid-4 .c-sticker { border-radius: 2px; box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4); }

.grid-5 { grid-template-columns: repeat(5, 1fr); gap: 1.5px; padding: 2px; }
.grid-5 .c-sticker { border-radius: 1.5px; box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.35); }

.grid-6 { grid-template-columns: repeat(6, 1fr); gap: 1px; padding: 2px; }
.grid-6 .c-sticker { border-radius: 1px; box-shadow: inset 0 0 1px rgba(255, 255, 255, 0.3); }

.grid-7 { grid-template-columns: repeat(7, 1fr); gap: 0.8px; padding: 1.5px; }
.grid-7 .c-sticker { border-radius: 0.8px; box-shadow: inset 0 0 1px rgba(255, 255, 255, 0.3); }

/* ── Progressive solve sticker animations (6.0s multi-phase) ── */
/* Front Face (Solves to Electric Blue #38bdf8) */
.cs-b-p1 { animation: to-blue-p1 6.0s infinite; }
.cs-b-p2 { animation: to-blue-p2 6.0s infinite; }
.cs-b-p3 { animation: to-blue-p3 6.0s infinite; }
.cs-b-p4 { animation: to-blue-p4 6.0s infinite; }

@keyframes to-blue-p1 {
	0%, 12% { background: #f87171; }
	24%, 90% { background: #38bdf8; }
	96%, 100% { background: #f87171; }
}
@keyframes to-blue-p2 {
	0%, 20% { background: #facc15; }
	35%, 90% { background: #38bdf8; }
	96%, 100% { background: #facc15; }
}
@keyframes to-blue-p3 {
	0%, 35% { background: #4ade80; }
	45%, 90% { background: #38bdf8; }
	96%, 100% { background: #4ade80; }
}
@keyframes to-blue-p4 {
	0%, 42% { background: #fb923c; }
	52%, 90% { background: #38bdf8; }
	96%, 100% { background: #fb923c; }
}

/* Right Face (Solves to Red #f87171) */
.cs-r-p1 { animation: to-red-p1 6.0s infinite; }
.cs-r-p2 { animation: to-red-p2 6.0s infinite; }
.cs-r-p3 { animation: to-red-p3 6.0s infinite; }
.cs-r-p4 { animation: to-red-p4 6.0s infinite; }

@keyframes to-red-p1 {
	0%, 12% { background: #38bdf8; }
	24%, 90% { background: #f87171; }
	96%, 100% { background: #38bdf8; }
}
@keyframes to-red-p2 {
	0%, 20% { background: #fb923c; }
	35%, 90% { background: #f87171; }
	96%, 100% { background: #fb923c; }
}
@keyframes to-red-p3 {
	0%, 35% { background: #f8fafc; }
	45%, 90% { background: #f87171; }

/* ── 🔍 1. 인스펙션 상태: 큐브를 맞추지 않고 돌려가며 훑어보는 애니메이션 ── */
body.inspect .stage-cube-wrap {
	animation: none;
	filter: drop-shadow(0 10px 20px rgba(251, 191, 36, 0.25));
}
body.inspect .stage-cube-wrap::after {
	display: none;
}
body.inspect .stage-cube-wrap .cube-3d {
	animation: cube-inspect-turn 5.0s linear infinite;
}
@keyframes cube-inspect-turn {
	0%   { transform: rotateX(-24deg) rotateY(0deg) rotateZ(0deg); }
	25%  { transform: rotateX(-16deg) rotateY(90deg) rotateZ(4deg); }
	50%  { transform: rotateX(-28deg) rotateY(180deg) rotateZ(0deg); }
	75%  { transform: rotateX(-20deg) rotateY(270deg) rotateZ(-4deg); }
	100% { transform: rotateX(-24deg) rotateY(360deg) rotateZ(0deg); }
}
body.inspect .stage-cube-wrap .c-sticker {
	animation: none !important; /* 인스펙션 중에는 색상이 맞춰지지 않고 스크램블 유지 */
}

/* ── ⏱️ 2. 솔브 진행 중 (Running): 멈추지 않고 계속 매끄럽게 고속 회전 ── */
body.running .stage-cube-wrap {
	opacity: 0.95;
	animation: none;
	filter: drop-shadow(0 10px 24px rgba(56, 189, 248, 0.3));
}
body.running .stage-cube-wrap::after {
	display: none;
}
body.running .stage-cube-wrap .cube-3d {
	animation: cube-running-fast-solve 1.0s linear infinite;
}
@keyframes cube-running-fast-solve {
	0%   { transform: rotateX(-24deg) rotateY(45deg) rotateZ(0deg); }
	25%  { transform: rotateX(-18deg) rotateY(135deg) rotateZ(6deg); }
	50%  { transform: rotateX(20deg) rotateY(225deg) rotateZ(-4deg); }
	75%  { transform: rotateX(-22deg) rotateY(315deg) rotateZ(5deg); }
	100% { transform: rotateX(-24deg) rotateY(405deg) rotateZ(0deg); }
}
body.running .stage-cube-wrap .c-sticker {
	animation: running-scramble-twist 1.0s linear infinite !important;
}
@keyframes running-scramble-twist {
	0%   { filter: hue-rotate(0deg); }
	50%  { filter: hue-rotate(180deg); }
	100% { filter: hue-rotate(360deg); }
}

/* ── 🏆 3. 최종 스탑 순간: 100% 완성 쇼케이스 & 빅토리 쇼크웨이브 발동! ── */
body.just-solved .stage-cube-wrap {
	animation: just-solved-halo-glow 3.5s ease-out forwards;
}
@keyframes just-solved-halo-glow {
	0% {
		filter: drop-shadow(0 0 45px rgba(56, 189, 248, 1))
		        drop-shadow(0 0 25px rgba(74, 222, 128, 0.9))
		        drop-shadow(0 12px 28px rgba(0, 0, 0, 0.6));
	}
	80% {
		filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.85))
		        drop-shadow(0 0 16px rgba(74, 222, 128, 0.7));
	}
	100% {
		filter: drop-shadow(0 10px 20px rgba(56, 189, 248, 0.2));
	}
}
body.just-solved .stage-cube-wrap::after {
	animation: just-solved-shockwave-burst 1.2s ease-out forwards;
}
@keyframes just-solved-shockwave-burst {
	0% {
		transform: scale(0.7);
		opacity: 1;
		border-color: rgba(56, 189, 248, 1);
		box-shadow: 0 0 30px rgba(56, 189, 248, 0.9), inset 0 0 25px rgba(74, 222, 128, 0.6);
	}
	70% {
		transform: scale(1.8);
		opacity: 0.2;
		border-color: rgba(74, 222, 128, 0.6);
	}
	100% {
		transform: scale(2.0);
		opacity: 0;
		border-color: rgba(74, 222, 128, 0);
	}
}
body.just-solved .stage-cube-wrap .cube-3d {
	animation: just-solved-showcase 3.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes just-solved-showcase {
	0%   { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.22); }
	18%  { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.08); }
	85%  { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.08); }
	100% { transform: rotateX(-26deg) rotateY(405deg) rotateZ(0deg) scale(1.0); }
}
/* 스탑 시 전체 6면 100% 완벽한 단색 완성 */
body.just-solved .cube-front .c-sticker  { background: #38bdf8 !important; animation: none !important; }
body.just-solved .cube-back .c-sticker   { background: #4ade80 !important; animation: none !important; }
body.just-solved .cube-right .c-sticker  { background: #f87171 !important; animation: none !important; }
body.just-solved .cube-left .c-sticker   { background: #fb923c !important; animation: none !important; }
body.just-solved .cube-top .c-sticker    { background: #f8fafc !important; animation: none !important; }
body.just-solved .cube-bottom .c-sticker { background: #facc15 !important; animation: none !important; }

/* ── ✋ 4. 누르고 있는 상태 (Hold / Ready) ── */
body.hold .stage-cube-wrap,
body.ready .stage-cube-wrap {
	opacity: 0.65;
	transform: scale(0.92);
}
#time {
	/* 글자 수(--ch)에 맞춰 가로폭을 꽉 채우는 크기. 고정폭 폰트 한 자 ≈ 0.62em */
	font-size: min(calc(70cqw / (var(--ch, 6) * 0.62)), 20vh, 180px);
	font-family: var(--mono);
	font-weight: 300;
	letter-spacing: -.02em;
	line-height: 1;
	transition: color .08s, text-shadow .08s;
}
body.inspect #time { color: var(--warn); text-shadow: 0 0 20px rgba(251, 191, 36, 0.25); }
body.hold #time { color: var(--hold); text-shadow: 0 0 20px rgba(248, 113, 113, 0.25); }
body.ready #time { color: var(--ready); text-shadow: 0 0 24px rgba(74, 222, 128, 0.35); }
body.running #scramble, body.running header, body.running aside { opacity: .12; transition: opacity .2s; }
footer { padding: 12px 24px 18px; text-align: center; color: var(--muted); font-size: 12px; }

/* ── 동기화 설정 ── */
dialog {
	background: var(--surface); color: var(--text);
	border: 1px solid var(--border); border-radius: var(--radius);
	padding: 22px; max-width: 420px; width: calc(100% - 32px);
}
dialog::backdrop { background: #000a; }
dialog h3 { font-size: 16px; margin-bottom: 8px; }
dialog p { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
dialog label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
dialog input {
	display: block; width: 100%; margin-top: 5px; padding: 9px 11px;
	background: var(--bg); color: var(--text);
	border: 1px solid var(--border); border-radius: 9px; font-size: 14px;
}
dialog .row { display: flex; gap: 8px; margin-top: 18px; }
dialog .row button {
	flex: 1; padding: 10px 14px; border-radius: 9px; cursor: pointer;
	background: var(--surface-2); border: 1px solid var(--border); font-size: 13px;
	font-weight: 500; color: var(--text);
	transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
dialog .row button:hover {
	background: #1e293b; border-color: rgba(56, 189, 248, 0.3); transform: translateY(-1px);
}
dialog .row button:active { transform: translateY(0) scale(0.98); }
dialog .row button:first-child {
	background: var(--accent); border-color: var(--accent); color: #090d16; font-weight: 700;
}
dialog .row button:first-child:hover {
	background: #7dd3fc; border-color: #7dd3fc;
}
#gmsg { font-size: 12px; color: var(--muted); min-height: 1.4em; }
#gmsg.err { color: var(--hold); }
#gmsg.ok { color: var(--ready); }

/* ── 터치 기기(태블릿/폰) 전용 배율. 마우스 쓰는 PC에는 적용되지 않는다 ── */
@media (pointer: coarse) {
	/* 태블릿 타이머와 대형 3D 큐브의 조화로운 레이아웃 */
	#stage { gap: 50px; padding: 14px 16px 20px; }
	.stage-cube-wrap { margin-top: 0; margin-bottom: 24px; }
	#time { font-size: min(calc(62cqw / (var(--ch, 6) * 0.62)), 17vh, 140px); font-weight: 300; }
	#scramble { font-size: clamp(15px, 1.9vw, 21px); min-height: 2.5em; padding: 4px 20px 0; }
	.stage-cube-wrap .cube-anim-box { width: 100px; height: 100px; perspective: 450px; }
	.stage-cube-wrap .cube-3d { width: 68px; height: 68px; }
	.stage-cube-wrap .cube-face { width: 68px; height: 68px; border-radius: 5px; }
	.grid-2 { gap: 3.5px; padding: 3.5px; }
	.grid-3 { gap: 2.5px; padding: 2.5px; }
	.grid-4 { gap: 1.8px; padding: 2px; }
	.grid-5 { gap: 1.2px; padding: 1.8px; }
	.grid-6 { gap: 0.9px; padding: 1.5px; }
	.grid-7 { gap: 0.7px; padding: 1.2px; }
	.stage-cube-wrap .cube-front  { transform: rotateY(0deg) translateZ(34px); filter: brightness(1.0); }
	.stage-cube-wrap .cube-back   { transform: rotateY(180deg) translateZ(34px); filter: brightness(0.78); }
	.stage-cube-wrap .cube-right  { transform: rotateY(90deg) translateZ(34px); filter: brightness(0.88); }
	.stage-cube-wrap .cube-left   { transform: rotateY(-90deg) translateZ(34px); filter: brightness(0.82); }
	.stage-cube-wrap .cube-top    { transform: rotateX(90deg) translateZ(34px); filter: brightness(1.15); }
	.stage-cube-wrap .cube-bottom { transform: rotateX(-90deg) translateZ(34px); filter: brightness(0.70); }
	header {
		padding: 10px 14px;
		gap: 6px;
		flex-wrap: wrap;
	}
	.hdr-group {
		gap: 6px;
	}
	select#event, .hdr-btn {
		padding: 6px 10px;
		font-size: 12px;
		border-radius: 8px;
	}
	select#event {
		padding-right: 24px;
	}
	.brand { padding: 12px 16px 10px; }
	.stat { padding: 10px 12px; }
	.stat b { font-size: 16px; }
	.solve { padding: 6px 8px; }
	.side-foot { padding: 10px 14px 14px; }
	.btn-clear-solves { padding: 8px 12px; font-size: 12px; }
	footer { display: none; }      /* 키보드 안내는 터치에서 필요 없다 */
}
@media (pointer: coarse) and (min-width: 821px) {
	#app { grid-template-columns: 250px 1fr; }
}

@media (max-width: 820px) {
	#app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
	aside { order: 2; border-right: 0; border-top: 1px solid var(--border); max-height: 42vh; }
	.brand { display: none; }
	footer { display: none; }
}

				<button id="insp" class="hdr-btn toggle" title="인스펙션 15초 카운트다운 토글"><span class="btn-dot"></span>인스펙션 15s</button>
				<button id="cancel" class="hdr-btn btn-cancel" title="타이머 0초로 되돌리기 (Esc)"><span class="btn-icon">↺</span>타이머 리셋</button>
				<button id="newscr" class="hdr-btn" title="새 스크램블 생성"><span class="btn-icon">↻</span>새 스크램블</button>
			</div>
			<span class="spacer"></span>
			<div class="hdr-group hdr-right">
				<span class="hint" id="status"></span>
				<button id="sync" class="hdr-btn toggle btn-sync" title="Gist 동기화 설정"><span class="btn-icon">☁</span>동기화</button>
			</div>
		</header>
		<div id="scramble">스크램블 생성 중…</div>
		<div id="stage">
			<div class="stage-cube-wrap">
				<div class="cube-anim-box" title="Rubik's Cube"></div>
			</div>
			<div id="time" style="--ch: 6">0.000</div>
		</div>
		<footer>스페이스를 누르고 있다가 떼면 시작(인스펙션 켜면 카운트다운 먼저) · 아무 키나 누르면 정지 · Esc 타이머 리셋 · 스크램블 클릭하면 새로 생성</footer>
	</main>
</div>
<input type="file" id="file" accept="application/json" hidden>

<dialog id="syncdlg">
	<h3>gist 동기화</h3>
	<p>기록을 비공개 gist와 자동으로 합칩니다. 토큰은 <b>이 기기 브라우저에만</b> 저장되고 서버로 전송되지 않습니다.</p>
	<label>gist ID <input id="gid" inputmode="latin" autocomplete="off" spellcheck="false" placeholder="a1b2c3d4..."></label>
	<label>토큰 (gist 스코프) <input id="gtok" type="password" autocomplete="off" placeholder="ghp_..."></label>
	<div id="gmsg"></div>
	<div class="row">
		<button id="gsave">저장하고 동기화</button>
		<button id="gdel">토큰 삭제</button>
		<button id="gclose">닫기</button>
	</div>
</dialog>

<dialog id="rendlg">
	<h3>세션 이름 변경</h3>
	<p>세션의 새로운 이름을 입력하세요.</p>
	<label>세션 이름 <input id="renInput" autocomplete="off" spellcheck="false" maxlength="50" placeholder="예: session 1, 3x3 OH"></label>
	<div class="row">
		<button id="renSave">저장</button>
		<button id="renCancel">취소</button>
	</div>
</dialog>

<script>
// 서비스 워커 강제 갱신: index.html은 네트워크 우선이므로 이 인라인 스크립트는 항상 최신이다.
// 구버전 SW가 구 app.js/stats.js를 캐시하고 있으면 여기서 강제로 갱신한다.
if (navigator.serviceWorker) {
	navigator.serviceWorker.register('sw.js').then(function(reg) {
		reg.update().catch(function(){});
		// 새 SW가 대기 중이면 즉시 활성화
		if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
		reg.addEventListener('updatefound', function() {
			var nw = reg.installing;
			if (nw) nw.addEventListener('statechange', function() {
				if (nw.state === 'installed' && navigator.serviceWorker.controller) {
					nw.postMessage({ type: 'SKIP_WAITING' });
				}
			});
		});
	}).catch(function(){});
	navigator.serviceWorker.addEventListener('controllerchange', function() {
		window.location.reload();
	});
}
</script>
<script src="stats.js?v=30"></script>
<script src="app.js?v=30"></script>
</body>
</html>
