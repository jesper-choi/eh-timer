<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>eh timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="theme-color" content="#0b0d11">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root {
	--bg: #0b0d11;
	--surface: #14181f;
	--surface-2: #1b2029;
	--border: #262c38;
	--text: #e9ecf1;
	--muted: #8b93a3;
	--accent: #7aa2f7;
	--ready: #4ade80;
	--hold: #f87171;
	--warn: #fbbf24;
	--radius: 14px;
	/* 숫자 폭이 고정돼야 카운트가 흔들리지 않는다 */
	--mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
	background: var(--bg);
	color: var(--text);
	font: 15px/1.5 -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
	overflow: hidden;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	touch-action: manipulation;
	overscroll-behavior: none;      /* 태블릿에서 당겨서 새로고침 방지 */
}
button, select { font: inherit; color: inherit; }

#app {
	display: grid;
	grid-template-columns: 300px 1fr;
	height: 100%;
}

/* ── sidebar ── */
aside {
	background: var(--surface);
	border-right: 1px solid var(--border);
	display: flex;
	flex-direction: column;
	min-height: 0;
}
.brand {
	padding: 18px 20px 14px;
	font-size: 13px;
	letter-spacing: .18em;
	text-transform: uppercase;
	color: var(--muted);
}
.brand b { color: var(--text); font-weight: 600; }

.stats {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 1px;
	background: var(--border);
	border-block: 1px solid var(--border);
}
.stat { background: var(--surface); padding: 12px 14px; }
.stat span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.stat b { font-size: 18px; font-weight: 600; font-family: var(--mono); }

.list-head {
	display: flex; align-items: center; justify-content: space-between;
	padding: 12px 16px 8px; font-size: 12px; color: var(--muted);
}
#times { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.solve {
	display: flex; align-items: center; gap: 6px;
	padding: 7px 8px; border-radius: 10px;
	font-family: var(--mono);
}
.solve:hover { background: var(--surface-2); }
.solve .idx { width: 34px; color: var(--muted); font-size: 12px; }
.solve .t { flex: 1; font-weight: 500; }
.solve.dnf .t { color: var(--muted); text-decoration: line-through; }
.solve .acts { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.solve:hover .acts, .solve:focus-within .acts { opacity: 1; }
.solve .acts button {
	background: transparent; border: 1px solid var(--border); border-radius: 8px;
	padding: 2px 7px; font-size: 11px; color: var(--muted); cursor: pointer;
}
.solve .acts button:hover { color: var(--text); border-color: var(--muted); }
.solve .acts button.on { background: var(--accent); border-color: var(--accent); color: #0b0d11; }

.side-foot { padding: 10px 16px 16px; display: flex; gap: 8px; }
.side-foot button {
	flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
	padding: 8px; font-size: 12px; color: var(--muted); cursor: pointer;
}
.side-foot button:hover { color: var(--text); }

/* ── main ── */
main {
	display: flex; flex-direction: column;
	min-width: 0;
	position: relative;
}
header {
	display: flex; align-items: center; gap: 10px;
	padding: 16px 24px;
}
select#event {
	background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
	padding: 7px 12px; cursor: pointer; -webkit-appearance: none; appearance: none;
}
button.toggle {
	background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
	padding: 7px 12px; color: var(--muted); cursor: pointer;
}
button.toggle:hover { color: var(--text); }
button.toggle.on { background: var(--accent); border-color: var(--accent); color: #0b0d11; }
header .spacer { flex: 1; }
header .hint { color: var(--muted); font-size: 12px; }

#scramble {
	padding: 8px 40px 0;
	text-align: center;
	font-size: clamp(16px, 2.2vw, 26px);
	line-height: 1.45;
	font-weight: 500;
	letter-spacing: .01em;
	max-width: 980px;
	margin-inline: auto;
	word-spacing: .35em;
	cursor: pointer;
	min-height: 2.9em;
}
#stage {
	flex: 1;
	display: grid;
	place-items: center;
	min-height: 0;
	container-type: inline-size;
}
#time {
	/* 글자 수(--ch)에 맞춰 가로폭을 꽉 채우는 크기. 고정폭 폰트 한 자 ≈ 0.62em */
	font-size: min(calc(94cqw / (var(--ch, 6) * 0.62)), 40vh, 400px);
	font-family: var(--mono);
	font-weight: 300;
	letter-spacing: -.02em;
	line-height: 1;
	transition: color .08s;
}
body.inspect #time { color: var(--warn); }
body.hold #time { color: var(--hold); }
body.ready #time { color: var(--ready); }
body.running #scramble, body.running header, body.running aside { opacity: .12; transition: opacity .2s; }
footer { padding: 12px 24px 18px; text-align: center; color: var(--muted); font-size: 12px; }

@media (max-width: 820px) {
	#app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
	aside { order: 2; border-right: 0; border-top: 1px solid var(--border); max-height: 42vh; }
	.brand { display: none; }
	footer { display: none; }
}
</style>
</head>
<body>
<div id="app">
	<aside>
		<div class="brand"><b>eh</b> timer</div>
		<div class="stats" id="stats"></div>
		<div class="list-head"><span id="count">0 solves</span></div>
		<div id="times"></div>
		<div class="side-foot">
			<button id="export">내보내기</button>
			<button id="import">가져오기</button>
			<button id="clear">세션 삭제</button>
		</div>
	</aside>
	<main>
		<header>
			<select id="event"></select>
			<button id="insp" class="toggle">인스펙션 15초</button>
			<button id="newscr" class="toggle">새 스크램블</button>
			<span class="spacer"></span>
			<span class="hint" id="status"></span>
		</header>
		<div id="scramble">스크램블 생성 중…</div>
		<div id="stage"><div id="time" style="--ch: 6">0.000</div></div>
		<footer>스페이스를 누르고 있다가 떼면 시작(인스펙션 켜면 카운트다운 먼저) · 아무 키나 누르면 정지 · Esc 취소 · 스크램블 클릭하면 새로 생성</footer>
	</main>
</div>
<input type="file" id="file" accept="application/json" hidden>
<script src="stats.js"></script>
<script src="app.js"></script>
</body>
</html>
